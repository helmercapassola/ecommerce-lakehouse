# Job "Pipeline E-commerce": roda o pipeline e depois os testes de qualidade

resources:
  jobs:
    pipeline_ecommerce:
      name: "Pipeline E-commerce"
      job_clusters:
        - job_cluster_key: default
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            data_security_mode: "SINGLE_USER"
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ecommerce_silver.id}
        - task_key: run_tests
          depends_on:
            - task_key: run_pipeline
          job_cluster_key: default
          notebook_task:
            notebook_path: ../testes/testes_qualidade.py
            base_parameters:
              catalogo: ecommerce